<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTC MEGA SHOP - Lebih Untung Dari Shopee</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
.header{background:#ee4d2d;color:white;padding:12px 15px;position:sticky;top:0;z-index:100}
.header h1{font-size:20px}
.header p{font-size:12px;opacity:.9}
.search-box{background:white;padding:10px;display:flex;gap:8px;position:sticky;top:52px;z-index:99;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.search-box input{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;outline:none}
.search-box button{background:#ee4d2d;color:white;border:none;padding:10px 15px;border-radius:8px;font-weight:bold}
.cat{display:flex;gap:8px;overflow-x:auto;padding:10px;background:white}
.cat button{white-space:nowrap;padding:8px 14px;border:1px solid #ee4d2d;border-radius:20px;background:white;color:#ee4d2d;font-weight:bold;cursor:pointer}
.cat button.active{background:#ee4d2d;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:100%;height:150px;object-fit:cover}
.card-body{padding:10px}
.card-body h3{font-size:13px;height:32px;overflow:hidden}
.price{color:#ee4d2d;font-weight:bold;font-size:15px;margin:5px 0}
.sold{font-size:11px;color:#888}
.btn-add{width:100%;background:#ee4d2d;color:white;border:none;padding:9px;border-radius:8px;font-weight:bold;margin-top:6px}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#111;color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;z-index:200}
.cart-bar button{background:#25D366;color:white;border:none;padding:10px 18px;border-radius:8px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:flex-end}
.modal.open{display:flex}
.modal-box{background:white;width:100%;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.cart-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}
.qty button{padding:2px 8px;margin:0 3px}
.checkout{background:#25D366;color:white;border:none;width:100%;padding:13px;border-radius:10px;font-weight:bold;font-size:15px;margin-top:10px}
.close{background:#eee;border:none;width:100%;padding:10px;border-radius:10px;margin-top:8px}
.badge{background:#ffe600;color:#111;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h1>🛒 VTC MEGA SHOP</h1>
<p>0% Potongan Admin • Fast Respon WA • COD Se-Indonesia • Kirim 1-3 Hari</p>
</div>
<div class="search-box">
<input id="search" placeholder="Cari: baju, hp, sepatu..." oninput="render()">
<button onclick="render()">CARI</button>
</div>
<div class="cat" id="cats">
<button class="active" onclick="setCat('Semua',this)">Semua</button>
<button onclick="setCat('Fashion',this)">👕 Fashion</button>
<button onclick="setCat('Elektronik',this)">📱 Elektronik</button>
<button onclick="setCat('Makanan',this)">🍜 Makanan</button>
<button onclick="setCat('Kecantikan',this)">💄 Kecantikan</button>
<button onclick="setCat('Rumah',this)">🏠 Rumah</button>
</div>
<div class="grid" id="grid"></div>
<div style="padding:10px 15px 90px;text-align:center">
<h3>Mau Jualan GRATIS Tanpa Potongan?</h3>
<p style="font-size:13px;color:#666;margin:5px 0 10px">Di Shopee dipotong 10%. Di sini 0%. Duit 100% buat kamu.</p>
<button onclick="sellerWA()" style="background:#111;color:white;padding:12px 20px;border:none;border-radius:10px;font-weight:bold;width:100%">DAFTAR JADI SELLER - GRATIS</button>
</div>
<div class="cart-bar">
<div>🛒 <span id="cartCount">0</span> barang • <b id="cartTotal">Rp 0</b></div>
<button onclick="openCart()">LIHAT KERANJANG</button>
</div>
<div class="modal" id="modal">
<div class="modal-box">
<h2>Keranjang Kamu</h2>
<div id="cartList"></div>
<h3 style="margin-top:10px">Data Pembeli</h3>
<input id="nama" placeholder="Nama Lengkap">
<input id="alamat" placeholder="Alamat Lengkap + Patokan">
<label style="font-size:13px;font-weight:bold">Ekspedisi - COD BISA (Estimasi 1-3 Hari)</label>
<select id="ekspedisi">
<option value="JNE Reguler - Rp9.000 - 2-3 Hari" data-ongkir="9000">JNE Reguler - COD BISA - Rp9.000 - 2-3 Hari</option>
<option value="J&T Express - Rp8.000 - 1-3 Hari" data-ongkir="8000">J&T Express - COD BISA - Rp8.000 - 1-3 Hari</option>
<option value="GoSend - Rp12.000 - 1 Hari" data-ongkir="12000">GoSend - COD BISA - Rp12.000 - 1 Hari</option>
<option value="GrabExpress - Rp13.000 - 1 Hari" data-ongkir="13000">GrabExpress - COD BISA - Rp13.000 - 1 Hari</option>
<option value="VTC Express - Rp8.000 - 1-3 Hari" data-ongkir="8000">VTC Express - COD BISA - Rp8.000 - 1-3 Hari</option>
<option value="Pos Indonesia - Rp7.000 - 2-3 Hari" data-ongkir="7000">Pos Indonesia - COD BISA - Rp7.000 - 2-3 Hari</option>
</select>
<select id="bayar"><option>COD Cek Dulu - Buka Dulu, Cek, Baru Bayar</option><option>COD Biasa - Bayar Dulu, Baru Buka</option><option>Transfer Bank</option><option>QRIS</option></select>
<textarea id="catatan" placeholder="Catatan (opsional)"></textarea>
<button class="checkout" onclick="checkout()">CHECKOUT VIA WHATSAPP ✅</button>
<button class="close" onclick="closeCart()">Tutup</button>
</div>
</div>
<script>
let cat='Semua';
let cart={};
const WA_ADMIN='6283878502333';
const products=[
{id:1,name:"Kaos Oversize Premium VTC",price:75000,cat:"Fashion",sold:"Terjual 2,1rb",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"},
{id:2,name:"Sepatu Sneakers Running Pria/Wanita",price:185000,cat:"Fashion",sold:"Terjual 890",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"},
{id:3,name:"Headset Bluetooth TWS Pro",price:129000,cat:"Elektronik",sold:"Terjual 5,3rb",img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"},
{id:4,name:"Jam Tangan Smartwatch X8 Ultra",price:249000,cat:"Elektronik",sold:"Terjual 1,2rb",img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"},
{id:5,name:"Keripik Pedas Daun Jeruk 500gr",price:35000,cat:"Makanan",sold:"Terjual 10rb+",img:"https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=400"},
{id:6,name:"Serum Wajah Glowing Vitamin C",price:89000,cat:"Kecantikan",sold:"Terjual 3,4rb",img:"https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=400"},
{id:7,name:"Lampu LED Kamar Tidur Aesthetic",price:65000,cat:"Rumah",sold:"Terjual 670",img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=400"},
{id:8,name:"Tas Selempang Pria Premium",price:95000,cat:"Fashion",sold:"Terjual 1,5rb",img:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=400"},
];
function rupiah(n){return 'Rp '+n.toLocaleString('id-ID')}
function setCat(c,el){cat=c;document.querySelectorAll('.cat button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function render(){
let q=document.getElementById('search').value.toLowerCase();
let list=products.filter(p=>(cat==='Semua'||p.cat===cat)&&(p.name.toLowerCase().includes(q)));
document.getElementById('grid').innerHTML=list.map(p=>`
<div class="card">
<img src="${p.img}">
<div class="card-body">
<span class="badge">GRATIS ONGKIR* | 0% ADMIN</span>
<h3>${p.name}</h3>
<div class="price">${rupiah(p.price)}</div>
<div class="sold">⭐ 4.9 • ${p.sold}</div>
<button class="btn-add" onclick="add(${p.id})">+ KERANJANG</button>
</div>
</div>`).join('')||'<p style="grid-column:span 2;text-align:center;padding:20px">Barang tidak ditemukan</p>';
}
function add(id){cart[id]=(cart[id]||0)+1;updateCart()}
function updateCart(){
let count=0,total=0;
for(let id in cart){let p=products.find(x=>x.id==id);count+=cart[id];total+=p.price*cart[id]}
document.getElementById('cartCount').innerText=count;
document.getElementById('cartTotal').innerText=rupiah(total);
}
function openCart(){
let html='';let total=0;
for(let id in cart){let p=products.find(x=>x.id==id);let sub=p.price*cart[id];total+=sub;
html+=`<div class="cart-item"><div><b>${p.name}</b><br>${rupiah(p.price)} x ${cart[id]}</div><div><div class="qty"><button onclick="chg(${id},-1)">-</button>${cart[id]}<button onclick="chg(${id},1)">+</button></div><b>${rupiah(sub)}</b></div></div>`}
if(!html) html='<p>Keranjang masih kosong</p>';
else html+=`<div style="text-align:right;margin-top:10px"><b>Total Barang: ${rupiah(total)}</b><br><span style="font-size:12px;color:#666">+ Ongkir sesuai ekspedisi (1-3 Hari)</span></div>`;
document.getElementById('cartList').innerHTML=html;
document.getElementById('modal').classList.add('open');
}
function chg(id,d){cart[id]+=d;if(cart[id]<=0) delete cart[id];updateCart();openCart()}
function closeCart(){document.getElementById('modal').classList.remove('open')}
function checkout(){
let nama=document.getElementById('nama').value;
let alamat=document.getElementById('alamat').value;
let bayar=document.getElementById('bayar').value;
let eksEl=document.getElementById('ekspedisi');
let eks=eksEl.value;
let ongkir=parseInt(eksEl.options[eksEl.selectedIndex].getAttribute('data-ongkir'))||9000;
let catatan=document.getElementById('catatan').value||"-";
if(!nama||!alamat){alert('Isi Nama & Alamat dulu ya!');return}
if(Object.keys(cart).length===0){alert('Keranjang masih kosong!');return}
let pesan=`Halo Admin VTC MEGA SHOP! Saya mau ORDER:\n\n`;
let total=0;
for(let id in cart){let p=products.find(x=>x.id==id);let sub=p.price*cart[id];total+=sub;pesan+=`• ${p.name} x${cart[id]} = ${rupiah(sub)}\n`}
let grand=total+ongkir;
pesan+=`\nSubtotal: ${rupiah(total)}\nOngkir: ${rupiah(ongkir)}\nTOTAL: ${rupiah(grand)}\nEkspedisi: ${eks} (Estimasi 1-3 Hari)\nNama: ${nama}\nAlamat: ${alamat}\nBayar: ${bayar}\nCatatan: ${catatan}\n\nTolong diproses ya min!`;
window.open('https://wa.me/'+WA_ADMIN+'?text='+encodeURIComponent(pesan),'_blank');
}
function sellerWA(){window.open('https://wa.me/'+WA_ADMIN+'?text='+encodeURIComponent('Halo Admin VTC, saya mau DAFTAR JADI SELLER GRATIS 0% Potongan! Tolong info caranya.'),'_blank')}
render();
</script>
</body>
</html>
